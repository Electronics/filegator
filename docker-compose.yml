services:
  filegator:
    build: .
    image: filegator:latest
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - /var/www/files:/var/www/filegator/repository
      - private:/var/www/filegator/private
      - ./configuration.php:/var/www/filegator/configuration.php
volumes:
  private:
